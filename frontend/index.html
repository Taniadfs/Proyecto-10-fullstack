     <label for="contraseña"> contraseña</label>

   </div>

     </div>
     <p>¿No tienes cuenta? <a href="#" id="registrarse"> Registrarse</a></p>
    </form>

    <form id="formRegistrer" style="display: none;">

    </div>

      <label for="correo">correo</label>

    <p>¿Ya tienes cuenta? <a href="#" id="irALogin">Iniciar sesión</a></p>
    </form>
   </div>
